# Stands in for CloudFront in the local rehearsal (docker compose): one address that serves
# the website AND forwards /api/ to the backend. On AWS, CloudFront does exactly this.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Built files have a hash in their name, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a page of the single-page app: always answer with index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
